services:
  - type: web
    name: marvel-character-explorer
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
